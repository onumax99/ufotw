# Web 版（web/）をテストして GitHub Pages に公開する。
# 公開先: https://onumax99.github.io/ufotw/
# 初回だけ、リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にしておく必要がある。
name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "test/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: テスト
        run: node --test test/web/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v5
