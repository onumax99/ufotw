# Web 版（web/）をテストして GitHub Pages に公開する。
# 公開先: https://onumax99.github.io/ufotw/
# 初回だけ、リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にしておく必要がある。
name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "test/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: テスト
        run: node --test test/web/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # GitHub Pages は JS を最大 10 分キャッシュさせるので、公開直後に新旧の JS が混ざると
      # import の食い違いで読み込みに失敗する。公開のたびに JS・CSS の URL へ版（コミット）を付けて防ぐ。
      - name: JS・CSS の URL に版を付ける
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$v'#g; s#(import\('\./[A-Za-z0-9_-]+\.js)'\)#\1?v=$v')#g" web/js/*.js
          sed -i -E "s#(src=\"js/app\.js)\"#\1?v=$v\"#; s#(href=\"style\.css)\"#\1?v=$v\"#" web/index.html
          if grep -nE "(from |import\()'\./[^'?]+'" web/js/*.js; then
            echo "::error::版の付いていない import が残っています"
            exit 1
          fi
          grep -c "?v=$v" web/index.html web/js/*.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v5
